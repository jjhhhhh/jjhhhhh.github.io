<!DOCTYPE html>
<html lang="zh-CN"> 
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>公考备考工作台</title>
<style>
/* ============ 基础 ============ */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#F4F2EC; --panel:#FFFFFF; --panel2:#FAF9F5;
  --ink:#20282C; --sub:#6C7680; --line:#E5E0D6; --line2:#EFEBE3;
  --accent:#2B6E62; --accent2:#3E8E7E; --accent-soft:#E6F0ED;
  --red:#B04A3C; --red-soft:#FBEDEA; --amber:#BF8A34; --amber-soft:#FBF3E2;
  --blue:#3A6EA5; --blue-soft:#EAF1F9;
  --nav-bg:#152528; --nav-ink:#EDE9DF; --nav-dim:#9FB3B0;
  --shadow:0 1px 2px rgba(28,40,42,.04),0 8px 24px rgba(28,40,42,.06);
  --radius:16px;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","SimSun","STSong",Georgia,serif;
}
body.dark{
  --bg:#101619; --panel:#192226; --panel2:#141C1F;
  --ink:#E8EAE7; --sub:#95A2A4; --line:#2A353A; --line2:#222C30;
  --accent:#5FB7A5; --accent2:#7CCBB9; --accent-soft:#1D3A35;
  --red:#E08072; --red-soft:#3A2421; --amber:#DDB168; --amber-soft:#332A19;
  --blue:#7FAEDD; --blue-soft:#1D2C3A;
  --nav-bg:#0B1315; --nav-ink:#EDE9DF; --nav-dim:#849894;
  --shadow:0 1px 2px rgba(0,0,0,.2),0 10px 28px rgba(0,0,0,.25);
}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.65;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:.01em}
h1{font-size:21px}
h2{font-size:16px}
h3{font-size:15px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ============ 布局 ============ */
.app{display:grid;grid-template-columns:246px minmax(0,1fr);min-height:100vh;background:var(--nav-bg)}
.sidebar{background:var(--nav-bg);color:var(--nav-ink);display:flex;flex-direction:column;gap:6px;padding:22px 16px 16px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px 18px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(140deg,#3E8E7E,#1D4F46);color:#F3EFE4;display:grid;place-items:center;font-family:var(--serif);font-size:19px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.brand-name{font-size:15px;font-weight:600;letter-spacing:.06em}
.brand-sub{font-size:11px;color:var(--nav-dim);letter-spacing:.04em;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--nav-dim);font-size:14px;transition:background .18s,color .18s;position:relative}
.nav a svg{width:17px;height:17px;flex:0 0 17px;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.055);color:var(--nav-ink)}
.nav a.active{background:rgba(94,183,165,.14);color:#F5F1E6}
.nav a.active::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--accent2)}
.nav a .dot{margin-left:auto;background:rgba(255,255,255,.15);font-size:10.5px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;color:#EFEAD9}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:9px}
.exam-mini{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--nav-dim)}
.exam-mini b{display:block;color:#F2EEE3;font-size:12.5px;font-weight:500;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-btn{background:transparent;border:1px solid rgba(255,255,255,.12);color:var(--nav-dim);border-radius:10px;padding:8px 12px;text-align:left;cursor:pointer;font-size:12.5px;transition:.18s}
.side-btn:hover{color:#F2EEE3;border-color:rgba(255,255,255,.25)}

.main{min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.topbar{display:flex;align-items:center;gap:14px;padding:20px 28px 12px;position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 74%,transparent)}
.nav-toggle{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:16px}
.page-title{flex:1;min-width:0}
.page-title h1{font-size:22px;letter-spacing:.02em}
.page-title h1 span{font-family:var(--serif)}
.page-title p{margin:1px 0 0;color:var(--sub);font-size:12.5px}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.view{padding:6px 28px 64px}

/* ============ 通用组件 ============ */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-hd{display:flex;align-items:center;gap:10px;padding:16px 18px 0}
.card-hd h2{font-size:14.5px;display:flex;align-items:center;gap:8px}
.card-hd .hint{font-size:11.5px;color:var(--sub)}
.card-hd .spacer{flex:1}
.card-bd{padding:14px 18px 18px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 13px;cursor:pointer;font-size:13px;color:var(--ink);transition:.16s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;line-height:1.4}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2);border-color:var(--accent2);color:#fff}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn.danger:hover{background:var(--red-soft)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--sub)}
.btn.ghost:hover{background:var(--panel2);color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}
.btn.lg{padding:10px 20px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=date],input[type=number],input[type=search],textarea,select{
  font-family:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 11px;outline:none;transition:.16s;width:100%
}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 13%,transparent)}
textarea{resize:vertical;line-height:1.65}
label.fld{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:12px;color:var(--sub);cursor:pointer;transition:.16s;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent);font-weight:500}
.chip.static{cursor:default}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11.5px;background:var(--panel2);border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.tag.green{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.tag.red{background:var(--red-soft);border-color:transparent;color:var(--red)}
.tag.amber{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.tag.blue{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--sub)}
.small{font-size:12px}
hr.sep{border:0;border-top:1px solid var(--line2);margin:14px 0}
.empty{text-align:center;padding:34px 16px;color:var(--sub);font-size:13px}
.empty .big{font-size:30px;opacity:.45;margin-bottom:6px;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px;box-shadow:var(--shadow)}
.stat .k{font-size:11.5px;color:var(--sub);letter-spacing:.05em}
.stat .v{font-family:var(--serif);font-size:29px;font-weight:600;line-height:1.25;margin-top:2px}
.stat .v small{font-size:13px;font-family:var(--sans);color:var(--sub);font-weight:400;margin-left:2px}
.stat .f{font-size:11.5px;color:var(--sub);margin-top:2px}
.stat .f b{color:var(--accent);font-weight:500}

/* 首页倒计时 */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:24px 26px;color:#F3EFE4;background:
  radial-gradient(120% 140% at 88% -10%,rgba(126,197,178,.30),transparent 60%),
  radial-gradient(90% 120% at 8% 110%,rgba(191,138,52,.22),transparent 62%),
  linear-gradient(135deg,#1B3B37,#14262A 72%);
  box-shadow:0 12px 34px rgba(20,38,42,.20);border:1px solid rgba(255,255,255,.08)}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:100% 26px;pointer-events:none}
.hero .k{font-size:11.5px;letter-spacing:.22em;color:rgba(243,239,228,.60)}
.hero h3{font-family:var(--serif);font-size:20px;font-weight:600;margin-top:6px;letter-spacing:.04em}
.hero .num{font-family:var(--serif);font-size:62px;line-height:1;font-weight:600;margin-top:10px;letter-spacing:-.01em}
.hero .num span{font-size:15px;font-family:var(--sans);font-weight:400;color:rgba(243,239,228,.7);margin-left:8px;letter-spacing:.06em}
.hero .date{font-size:12.5px;color:rgba(243,239,228,.68);margin-top:8px}
.hero .prog{height:5px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:18px;overflow:hidden}
.hero .prog i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#8FD3C1,#D9C07A)}
.hero .prog-lb{display:flex;justify-content:space-between;font-size:11px;color:rgba(243,239,228,.62);margin-top:7px}
.hero .tools{position:absolute;right:18px;top:16px;display:flex;gap:6px}
.hero .tools button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#F3EFE4;border-radius:8px;padding:4px 10px;font-size:11.5px;cursor:pointer}
.hero .tools button:hover{background:rgba(255,255,255,.22)}

/* 打卡日历 */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-head .m{font-family:var(--serif);font-size:15px;font-weight:600}
.cal-head .sp{flex:1}
.cal-wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;font-size:10.5px;color:var(--sub);text-align:center;margin-bottom:5px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .d{height:clamp(32px,5.4vw,54px);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;color:var(--sub);background:var(--panel2);border:1px solid transparent;position:relative;cursor:default;line-height:1.1}
.cal .d.blank{background:transparent}
.cal .d.today{border-color:var(--accent);color:var(--accent);font-weight:600}
.cal .d.l1{background:color-mix(in srgb,var(--accent) 14%,var(--panel2));color:var(--ink)}
.cal .d.l2{background:color-mix(in srgb,var(--accent) 30%,var(--panel2));color:var(--ink)}
.cal .d.l3{background:color-mix(in srgb,var(--accent) 52%,var(--panel2));color:#fff}
.cal .d.l4{background:var(--accent);color:#fff}
.cal .d .n{font-size:9px;opacity:.8;margin-top:1px}
.cal-legend{display:flex;gap:4px;align-items:center;font-size:10.5px;color:var(--sub);margin-top:9px}
.cal-legend i{width:11px;height:11px;border-radius:3px;display:inline-block;background:var(--panel2);border:1px solid var(--line)}

/* 条形/进度 */
.bar-row{display:grid;grid-template-columns:76px 1fr 62px;align-items:center;gap:10px;margin-bottom:9px}
.bar-row .nm{font-size:12.5px;color:var(--ink);white-space:nowrap}
.bar-track{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden;border:1px solid var(--line2)}
.bar-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.bar-row .vl{font-size:12px;color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}
.bar-row .vl b{color:var(--ink);font-weight:600}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:12.8px}
.tbl th{text-align:left;font-weight:500;color:var(--sub);font-size:11.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.03em}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:var(--panel2)}
.tbl .num{font-variant-numeric:tabular-nums}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* 待办 */
.todo-add{display:grid;grid-template-columns:minmax(0,1fr) 128px 108px auto;gap:8px}
.period{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.period-hd{display:flex;align-items:center;gap:9px;padding:12px 16px;border-bottom:1px solid var(--line2);background:var(--panel2)}
.period-hd .t{font-family:var(--serif);font-size:14px;font-weight:600}
.period-hd .c{font-size:11.5px;color:var(--sub)}
.period-hd .sp{flex:1}
.todo-item{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line2)}
.todo-item:last-child{border-bottom:0}
.todo-item:hover{background:var(--panel2)}
.todo-item .box{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line);cursor:pointer;flex:0 0 19px;display:grid;place-items:center;color:transparent;font-size:11px;transition:.16s;background:var(--panel)}
.todo-item .box:hover{border-color:var(--accent)}
.todo-item.done .box{background:var(--accent);border-color:var(--accent);color:#fff}
.todo-item .tx{flex:1;min-width:0;font-size:13.5px;word-break:break-word}
.todo-item.done .tx{text-decoration:line-through;color:var(--sub)}
.todo-item .x{border:0;background:transparent;color:var(--sub);cursor:pointer;opacity:.55;font-size:14px;padding:2px 4px}
.todo-item .x:hover{color:var(--red);opacity:1}
.ring{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line2) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:5px;background:var(--panel);border-radius:50%}
.ring b{position:relative;font-size:12px;font-family:var(--serif)}

/* 刷题 */
.pbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:transparent;padding:5px 13px;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--sub)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.06);font-weight:500}
.qwrap{display:grid;grid-template-columns:minmax(0,1fr) 224px;gap:16px;align-items:start}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.qcard-hd{display:flex;align-items:center;gap:8px;padding:11px 16px;border-bottom:1px solid var(--line2);background:var(--panel2);flex-wrap:wrap}
.qcard-hd .idx{font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.qcard-hd .sp{flex:1}
.qbody{padding:18px 20px;position:relative;min-height:96px}
.qstem{font-size:14.5px;line-height:1.85;white-space:pre-wrap;word-break:break-word}
.qimg{margin-top:12px;max-width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px;position:relative;z-index:3}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 13px;border:1px solid var(--line);background:var(--panel);border-radius:10px;cursor:pointer;text-align:left;font-size:13.5px;line-height:1.6;transition:.15s;width:100%}
.opt:hover{border-color:var(--accent);background:var(--panel2)}
.opt .k{width:21px;height:21px;flex:0 0 21px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--sub);margin-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.right .k{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .k{background:var(--red);border-color:var(--red);color:#fff}
.qfoot{padding:12px 16px;border-top:1px solid var(--line2);display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel2)}
.ana{margin:0;padding:0 20px 18px;display:block}
.ana-in{border-top:1px dashed var(--line);padding-top:14px;margin-top:2px}
.ana-in .lb{font-size:12px;color:var(--sub);letter-spacing:.04em;margin-bottom:5px}
.ana-in .tx{font-size:13.5px;line-height:1.8;white-space:pre-wrap;color:var(--ink)}
.judge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:8px;font-size:12.5px;font-weight:500}
.judge.ok{background:var(--accent-soft);color:var(--accent)}
.judge.no{background:var(--red-soft);color:var(--red)}
.side-stack{display:flex;flex-direction:column;gap:12px}
.mini-card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 14px;box-shadow:var(--shadow)}
.mini-card .t{font-size:12px;color:var(--sub);margin-bottom:8px;letter-spacing:.04em;display:flex;gap:8px;align-items:center;justify-content:space-between}
.ink-tools{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.sw{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;box-shadow:0 0 0 1px var(--line) inset}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.ink-layer{position:absolute;inset:0;z-index:2;border-radius:4px;pointer-events:none;touch-action:none}
.ink-layer.act{pointer-events:auto;cursor:crosshair;background:rgba(255,255,255,.01)}
.ink-tip{font-size:11px;color:var(--sub);line-height:1.6}

/* 错题 */
.wcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.wcard-hd{display:flex;gap:9px;align-items:center;padding:11px 15px;flex-wrap:wrap;background:var(--panel2);border-bottom:1px solid var(--line2);cursor:pointer}
.wcard-hd .ttl{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcard-bd{padding:14px 16px 16px;display:none}
.wcard.open .wcard-bd{display:block}
.kv{display:grid;grid-template-columns:70px 1fr;gap:6px 12px;font-size:13px;margin-bottom:10px;align-items:start}
.kv .k{color:var(--sub);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini-box{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.mini-box.bad{border-color:color-mix(in srgb,var(--red) 25%,var(--line2));background:var(--red-soft)}
.mini-box.good{border-color:color-mix(in srgb,var(--accent) 25%,var(--line2));background:var(--accent-soft)}
.err-types{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}

/* 素材 */
.essay-card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:12px;padding:13px 16px;box-shadow:var(--shadow);margin-bottom:11px}
.essay-card .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin-bottom:7px}
.essay-card .body{font-size:13.5px;line-height:1.85;white-space:pre-wrap;word-break:break-word}
.essay-card .body.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.essay-card .ft{display:flex;gap:6px;align-items:center;margin-top:9px;flex-wrap:wrap}
.topic-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}

/* 套卷 */
.paper-tabs{display:flex;gap:8px;margin-bottom:14px}
.line-wrap{width:100%;overflow-x:auto}
.pstat{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:4px}
.pstat div .k{font-size:11px;color:var(--sub)}
.pstat div .v{font-family:var(--serif);font-size:22px;font-weight:600}
.pstat div .v small{font-family:var(--sans);font-size:11.5px;color:var(--sub);font-weight:400}

/* 时政 */
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--sub);background:var(--panel2);cursor:pointer;transition:.18s}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.pol-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.pol-hd{padding:11px 15px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;cursor:pointer;border-bottom:1px solid var(--line2)}
.pol-hd .d{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.pol-hd .t{flex:1;min-width:120px;font-size:13.5px;font-weight:500}
.pol-bd{padding:12px 16px 15px;font-size:13px;line-height:1.85;white-space:pre-wrap;display:none}
.pol-card.open .pol-bd{display:block}

/* 模态 */
.modal-wrap{position:fixed;inset:0;background:rgba(16,26,28,.42);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:5vh 16px;overflow-y:auto}
.modal-wrap.on{display:flex}
.modal{background:var(--panel);border-radius:18px;width:min(620px,100%);box-shadow:0 24px 60px rgba(0,0,0,.28);border:1px solid var(--line);animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.modal-hd{display:flex;align-items:center;gap:10px;padding:17px 20px 12px;border-bottom:1px solid var(--line2)}
.modal-hd h3{flex:1;font-size:15.5px}
.modal-hd button{border:0;background:transparent;font-size:17px;color:var(--sub);cursor:pointer;line-height:1}
.modal-bd{padding:16px 20px 20px;max-height:74vh;overflow-y:auto}
.modal-ft{display:flex;gap:8px;justify-content:flex-end;padding:0 20px 18px}
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,12px);background:#1C2E30;color:#F2EEE3;padding:9px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.22s;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* 表单栅格 */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fgrid3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.full{grid-column:1/-1}

@media (max-width:1060px){
  .qwrap{grid-template-columns:1fr}
  .qwrap .side-stack{order:2;flex-direction:row;flex-wrap:wrap}
  .qwrap .side-stack>*{flex:1;min-width:180px}
  .grid2,.grid3{grid-template-columns:1fr}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:252px;z-index:80;transform:translateX(-102%);transition:transform .22s ease;height:100vh;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .app.nav-open .sidebar{transform:none}
  .app.nav-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:70}
  .nav-toggle{display:inline-grid;place-items:center}
  .topbar{padding:14px 16px 10px}
  .view{padding:4px 16px 60px}
  .todo-add{grid-template-columns:1fr 1fr;}
  .fgrid,.fgrid3{grid-template-columns:1fr}
  .hero{padding:20px}
  .hero .num{font-size:50px}
  .two{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">公</div>
      <div><div class="brand-name">公考工作台</div><div class="brand-sub">可视化备考 · 本地存储</div></div>
    </div>
    <nav class="nav" id="nav">
      <a data-view="home" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/></svg>首页看板</a>
      <a data-view="todo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="m7.5 12 2.2 2.2 4.4-4.6"/></svg>今日待办<span class="dot" id="navTodoDot" style="display:none"></span></a>
      <a data-view="practice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20l3.6-1 10.9-11a2 2 0 0 0-2.9-2.8L4.6 16.2 4 20z"/><path d="M3.5 21h17"/></svg>行测刷题</a>
      <a data-view="wrong"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4.5h14v15.5l-7-4-7 4z"/><path d="M12 8v5M12 16.4v.2"/></svg>错题库<span class="dot" id="navWrongDot" style="display:none"></span></a>
      <a data-view="essay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5.5A2 2 0 0 1 6 3.5h13v17H6a2 2 0 0 0-2 2z"/><path d="M4 5.5v15"/><path d="M9 8h6M9 11.5h6"/></svg>申论素材</a>
      <a data-view="paper"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3.5 17.5 8 10l4 3.5 4.5-6 4 10"/><path d="M3.5 21h17"/></svg>套卷记录</a>
      <a data-view="policy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M7.5 3v4M16.5 3v4M3.5 9.5h17M8 13.5h5"/></svg>时政积累</a>
    </nav>
    <div class="side-foot">
      <div class="exam-mini" id="examMini"></div>
      <button class="side-btn" onclick="openSettings()">⚙ 设置 · 备份 · 说明</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="nav-toggle" onclick="toggleNav(event)">☰</button>
      <div class="page-title"><h1 id="pageTitle"><span>首页看板</span></h1><p id="pageSub"></p></div>
      <div class="top-actions" id="topActions"></div>
    </header>
    <div id="view" class="view"></div>
  </main>
</div>
<div id="modalWrap" class="modal-wrap" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-hd"><h3 id="modalTitle"></h3><button onclick="closeModal()">✕</button></div>
    <div id="modalBody" class="modal-bd"></div>
    <div id="modalFoot" class="modal-ft"></div>
  </div>
</div>
<div id="toast" class="toast"></div>
<input type="file" id="fileInput" hidden>
<script>
/* ============================================================
   0. 基础工具 / 存储 / 状态
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = (p = 'id') => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const todayStr = () => ymd(new Date());
const parseYmd = s => { const a = String(s || '').split('-').map(Number); return new Date(a[0] || 2026, (a[1] || 1) - 1, a[2] || 1); };
const D0 = s => parseYmd(s).getTime();
const diffDays = (a, b) => Math.round((D0(a) - D0(b)) / 86400000);
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 : 0;
const fmtW = ds => ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][parseYmd(ds).getDay()];
const fmtCN = ds => { const d = parseYmd(ds); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; };
const shortDate = ds => { const d = parseYmd(ds); return (d.getMonth() + 1) + '/' + d.getDate(); };
const timeStr = ts => { const d = new Date(ts); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
function clip(s, n) { s = String(s || '').replace(/\s+/g, ' '); return s.length > n ? s.slice(0, n) + '…' : s; }

const MODULES = ['常识判断', '言语理解', '数量关系', '判断推理', '资料分析'];
const PERIODS = [{ k: 'morning', n: '上午' }, { k: 'afternoon', n: '下午' }, { k: 'evening', n: '晚上' }];
const ERR_TYPES = ['审题失误', '概念模糊', '计算失误', '思路偏差', '时间不足', '粗心大意', '蒙题失误', '其他'];
const ESSAY_TYPES = ['金句', '案例', '论述', '开头', '结尾', '时评'];
const POL_CATS = ['会议', '讲话', '政策文件', '经济数据', '科技', '民生', '生态', '文化', '外交', '党建', '其他'];

const DEFAULT_STATE = () => ({
  v: 2,
  exams: [{ id: uid('ex'), name: '2027年国家公务员考试', date: '2027-11-28', note: '' }],
  activeExam: null,
  todos: [],
  questions: [],
  records: [],
  wrongs: [],
  essays: [],
  papers: [],
  politics: [],
  settings: { dailyGoal: 40, theme: 'light', userName: '', targetScore: '' },
  savedAt: 0
});
let state = DEFAULT_STATE();

/* 存储：优先 IndexedDB，失败回退 localStorage */
const Store = {
  mode: 'idb', db: null, KEY: 'gk_workbench_state',
  open() {
    return new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('no idb'));
      let req;
      try { req = indexedDB.open('gk_workbench', 1); } catch (e) { return rej(e); }
      req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains('kv')) req.result.createObjectStore('kv'); };
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error || new Error('idb error'));
      req.onblocked = () => rej(new Error('idb blocked'));
    });
  },
  async init() {
    try { this.db = await this.open(); this.mode = 'idb'; } catch (e) { this.db = null; this.mode = 'local'; }
  },
  read() {
    if (this.mode === 'idb' && this.db) {
      return new Promise(res => {
        try {
          const tx = this.db.transaction('kv', 'readonly').objectStore('kv').get('state');
          tx.onsuccess = () => res(tx.result || null);
          tx.onerror = () => res(null);
        } catch (e) { res(null); }
      });
    }
    try { const s = localStorage.getItem(this.KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
  },
  write(v) {
    if (this.mode === 'idb' && this.db) {
      return new Promise((res, rej) => {
        try {
          const tx = this.db.transaction('kv', 'readwrite');
          tx.objectStore('kv').put(v, 'state');
          tx.oncomplete = () => res(true);
          tx.onerror = () => rej(tx.error || new Error('write error'));
        } catch (e) { rej(e); }
      }).catch(() => this.writeLocal(v));
    }
    return this.writeLocal(v);
  },
  writeLocal(v) {
    try { localStorage.setItem(this.KEY, JSON.stringify(v)); return Promise.resolve(true); }
    catch (e) { toast('本地存储空间不足，请在「设置」中导出备份并清理图片/手写数据'); return Promise.reject(e); }
  }
};

function normalizeState(s) {
  const d = DEFAULT_STATE();
  if (!s || typeof s !== 'object') return d;
  const out = Object.assign({}, d, s);
  out.settings = Object.assign({}, d.settings, s.settings || {});
  ['exams', 'todos', 'questions', 'records', 'wrongs', 'essays', 'papers', 'politics'].forEach(k => { if (!Array.isArray(out[k])) out[k] = d[k]; });
  if (!out.exams.length) out.exams = d.exams;
  if (!out.activeExam || !out.exams.some(e => e.id === out.activeExam)) out.activeExam = out.exams[0].id;
  return out;
}

let saveTimer = null, savingCount = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    state.savedAt = Date.now();
    savingCount++;
    try { await Store.write(state); } catch (e) { }
    savingCount--;
  }, 420);
}
async function saveNow() { clearTimeout(saveTimer); state.savedAt = Date.now(); try { await Store.write(state); } catch (e) { } }

function toast(msg, ms = 2400) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), ms);
}

/* 模态框 */
let _onOk = null;
function openModal(title, body, opts = {}) {
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = body;
  _onOk = opts.onOk || null;
  let foot = '';
  if (opts.footHtml) foot = opts.footHtml;
  else {
    foot = '<button class="btn" onclick="closeModal()">取消</button>';
    if (opts.okText !== false) foot += '<button class="btn primary" id="modalOk">' + esc(opts.okText || '保存') + '</button>';
  }
  $('#modalFoot').innerHTML = foot;
  const ok = $('#modalOk');
  if (ok) ok.onclick = () => { const r = _onOk ? _onOk() : true; if (r !== false) closeModal(); };
  $('#modalWrap').classList.add('on');
  if (opts.onMount) setTimeout(() => opts.onMount($('#modalBody')), 0);
}
function closeModal() { $('#modalWrap').classList.remove('on'); $('#modalBody').innerHTML = ''; $('#modalFoot').innerHTML = ''; _onOk = null; }
function confirmModal(text, onYes, okText = '确认') {
  openModal('请确认', '<div style="font-size:13.5px;line-height:1.8">' + esc(text) + '</div>', { okText, onOk: onYes });
}

/* 考试 */
function activeExam() { return state.exams.find(e => e.id === state.activeExam) || state.exams[0]; }
function examLeft() { const e = activeExam(); return e ? diffDays(e.date, todayStr()) : 0; }

/* 统计 */
function getStats() {
  const recs = state.records || [];
  let total = 0, correct = 0;
  const byMod = {}; MODULES.forEach(m => byMod[m] = { t: 0, c: 0 });
  const dayMap = {};
  const modSet = new Set();
  recs.forEach(r => {
    const c = num(r.count), ok = num(r.correct);
    total += c; correct += ok;
    if (!byMod[r.module]) byMod[r.module] = { t: 0, c: 0 };
    byMod[r.module].t += c; byMod[r.module].c += ok;
    dayMap[r.date] = (dayMap[r.date] || 0) + c;
    modSet.add(r.module);
  });
  const days = [];
  for (let i = 6; i >= 0; i--) { const d = addDays(todayStr(), -i); days.push({ date: d, count: dayMap[d] || 0 }); }
  let streak = 0;
  let start = dayMap[todayStr()] ? todayStr() : addDays(todayStr(), -1);
  while ((dayMap[start] || 0) > 0) { streak++; start = addDays(start, -1); }
  const todayCount = dayMap[todayStr()] || 0;
  const goal = num(state.settings.dailyGoal) || 40;
  return {
    total, correct, acc: pct(correct, total), byMod, days, dayMap, modSet,
    streak, todayCount, goal, todayRate: clamp(pct(todayCount, goal), 0, 100),
    wrongCount: (state.wrongs || []).filter(w => w.status !== '已掌握').length,
    favCount: (state.questions || []).filter(q => q.favorited).length
  };
}

function addRecord(o) {
  state.records.push(Object.assign({ id: uid('r'), date: todayStr(), ts: Date.now(), module: '未分类', chapter: '', count: 0, correct: 0, kind: 'single' }, o));
  save();
}

/* 数据备份 */
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '公考工作台备份_' + todayStr() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('已导出备份文件');
}
function importData(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const obj = JSON.parse(fr.result);
      const next = normalizeState(obj);
      confirmModal('导入将覆盖当前全部数据（待办、题库、错题、素材、套卷、时政），建议先导出备份。确定导入？', () => {
        state = next; saveNow().then(() => { toast('导入成功'); render(); refreshBadges(); });
      }, '覆盖导入');
    } catch (e) { toast('文件格式不正确：' + e.message); }
  };
  fr.readAsText(file);
}

/* 通用下载 */
function downloadText(name, text, mime = 'text/plain') {
  const blob = new Blob([text], { type: mime + ';charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
function copyText(t) {
  const done = () => toast('已复制');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, fallback);
  else fallback();
  function fallback() {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('复制失败，请手动选择'); }
    ta.remove();
  }
}

/* 导航 */
function toggleNav(e) { if (e) e.stopPropagation(); $('#app').classList.toggle('nav-open'); }
document.addEventListener('click', e => { if ($('#app').classList.contains('nav-open') && !e.target.closest('#sidebar') && !e.target.closest('.nav-toggle')) $('#app').classList.remove('nav-open'); });

function refreshBadges() {
  const openTodos = (state.todos || []).filter(t => t.date === todayStr() && !t.done).length;
  const d1 = $('#navTodoDot'); if (d1) { d1.textContent = openTodos; d1.style.display = openTodos ? 'grid' : 'none'; }
  const unmastered = (state.wrongs || []).filter(w => w.status !== '已掌握').length;
  const d2 = $('#navWrongDot'); if (d2) { d2.textContent = unmastered; d2.style.display = unmastered ? 'grid' : 'none'; }
  const e = activeExam();
  const em = $('#examMini');
  if (em && e) {
    const left = diffDays(e.date, todayStr());
    em.innerHTML = '<b>' + esc(e.name) + '</b>' + (left >= 0 ? '距考试 ' + left + ' 天' : '考试已过 ' + (-left) + ' 天');
  }
}

/* 视图注册 */
const VIEWS = {};
let currentView = 'home';
function setView(v) {
  if (!VIEWS[v]) v = 'home';
  currentView = v;
  $('#app').classList.remove('nav-open');
  $$('#nav a').forEach(a => a.classList.toggle('active', a.dataset.view === v));
  history.replaceState(null, '', '#' + v);
  render();
  window.scrollTo({ top: 0, behavior: 'auto' });
}
function render() {
  const v = VIEWS[currentView] || VIEWS.home;
  $('#pageTitle').innerHTML = '<span>' + esc(v.title || '') + '</span>';
  $('#pageSub').textContent = typeof v.sub === 'function' ? v.sub() : (v.sub || '');
  $('#topActions').innerHTML = v.actions ? v.actions() : '';
  if (v.actionsMount) setTimeout(v.actionsMount, 0);
  $('#view').innerHTML = '';
  v.render($('#view'));
  refreshBadges();
}
$('#nav').addEventListener('click', e => {
  const a = e.target.closest('a[data-view]'); if (!a) return;
  e.preventDefault(); setView(a.dataset.view);
});

/* ============================================================
   1. 图表（纯 SVG，无外部依赖）
   ============================================================ */
function chartBars(days, opts = {}) {
  const goal = num(opts.goal) || 0;
  const W = 560, H = 168, padL = 6, padR = 6, padT = 18, padB = 30;
  const max = Math.max(goal, ...days.map(d => d.count), 8) * 1.12;
  const plotH = H - padT - padB, bw = (W - padL - padR) / days.length;
  const accent = opts.color || 'var(--accent)';
  let bars = '', labels = '', goalLine = '';
  days.forEach((d, i) => {
    const x = padL + i * bw + bw * 0.18;
    const w = bw * 0.64;
    const h = Math.max(1.5, plotH * d.count / max);
    const y = padT + plotH - h;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="3.5" fill="${accent}" opacity="${d.count ? 0.92 : 0.16}"/>`;
    if (d.count) bars += `<text x="${(x + w / 2).toFixed(1)}" y="${(y - 5).toFixed(1)}" font-size="11" fill="var(--sub)" text-anchor="middle">${d.count}</text>`;
    labels += `<text x="${(padL + i * bw + bw / 2).toFixed(1)}" y="${H - 10}" font-size="10.5" fill="var(--sub)" text-anchor="middle">${esc(opts.short !== false ? shortDate(d.date) : d.date)}</text>`;
  });
  if (goal && goal < max) {
    const gy = padT + plotH - plotH * goal / max;
    goalLine = `<line x1="${padL}" x2="${W - padR}" y1="${gy.toFixed(1)}" y2="${gy.toFixed(1)}" stroke="var(--line)" stroke-dasharray="4 4"/><text x="${W - padR}" y="${(gy - 4).toFixed(1)}" font-size="9.5" fill="var(--sub)" text-anchor="end">目标 ${goal}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-height:190px">${goalLine}${bars}${labels}</svg>`;
}

function chartLine(points, opts = {}) {
  const W = 920, H = 300, padL = 40, padR = 22, padT = 22, padB = 34;
  const accent = opts.color || 'var(--accent)';
  if (!points.length) return '<div class="empty"><span class="big">↗</span>还没有记录，先添加一次套卷成绩</div>';
  const ys = points.map(p => num(p.y));
  const lo = Math.min(...ys), hi = Math.max(...ys);
  const pad = Math.max(5, (hi - lo) * 0.5);
  const rough = Math.max(5, (hi - lo + pad * 2) / 4);
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const yStep = (rough / mag <= 1 ? 1 : rough / mag <= 2 ? 2 : rough / mag <= 5 ? 5 : 10) * mag;
  const minY = Math.max(0, Math.floor((lo - pad) / yStep) * yStep);
  const maxBob = Math.ceil((hi + pad) / yStep) * yStep;
  const span = Math.max(yStep * 2, maxBob - minY);
  const maxY = minY + span;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const total = points.length;
  const X = i => total === 1 ? padL + plotW / 2 : padL + plotW * i / (total - 1);
  const Y = v => padT + plotH - plotH * (num(v) - minY) / span;
  let grid = '', ticks = '';
  for (let v = minY; v <= maxY + 0.01; v += yStep) {
    const y = Y(v);
    grid += `<line x1="${padL}" x2="${W - padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line2)"/>`;
    ticks += `<text x="${padL - 8}" y="${(y + 3.5).toFixed(1)}" font-size="11" fill="var(--sub)" text-anchor="end">${Math.round(v)}</text>`;
  }
  const pts = points.map((p, i) => [X(i), Y(p.y)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = total > 1 ? `<path d="${d} L ${pts[total - 1][0].toFixed(1)} ${padT + plotH} L ${pts[0][0].toFixed(1)} ${padT + plotH} Z" fill="${accent}" opacity="0.07"/>` : '';
  let dots = '', labels = '';
  const step = Math.ceil(total / 9);
  points.forEach((p, i) => {
    dots += `<g><title>${esc(p.label || '')} · ${p.y}${p.full ? ' / ' + p.full : ''}</title><circle cx="${pts[i][0].toFixed(1)}" cy="${pts[i][1].toFixed(1)}" r="4.5" fill="${accent}" stroke="var(--panel)" stroke-width="1.5"/></g>`;
    if (i % step === 0 || i === total - 1) {
      labels += `<text x="${pts[i][0].toFixed(1)}" y="${H - 10}" font-size="10.5" fill="var(--sub)" text-anchor="middle">${esc(p.xLabel || shortDate(p.x))}</text>`;
    }
  });
  const avg = ys.reduce((a, b) => a + b, 0) / total;
  const avgY = Y(avg);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:480px;height:auto">
    ${grid}${ticks}${area}<path d="${d}" fill="none" stroke="${accent}" stroke-width="2.2" stroke-linejoin="round"/>
    ${total > 1 ? `<line x1="${padL}" x2="${W - padR}" y1="${avgY.toFixed(1)}" y2="${avgY.toFixed(1)}" stroke="${accent}" stroke-dasharray="6 4" opacity=".55"/><text x="${W - padR}" y="${(avgY - 6).toFixed(1)}" font-size="10.5" fill="${accent}" text-anchor="end">平均 ${avg.toFixed(1)}</text>` : ''}
    ${dots}${labels}</svg>`;
}

/* ============================================================
   2. 手写画板（Apple Pencil / 鼠标 / 触控）
   ============================================================ */
class Ink {
  constructor(canvas, onChange) {
    this.cv = canvas; this.ctx = canvas.getContext('2d');
    this.strokes = []; this.color = '#263238'; this.size = 2.4; this.eraser = false;
    this.drawing = false; this.cur = null; this.onChange = onChange || null;
    this.bind();
    this.resize();
    if (window.ResizeObserver) {
      this.ro = new ResizeObserver(() => this.resize());
      this.ro.observe(canvas.parentElement || canvas);
    } else window.addEventListener('resize', () => this.resize());
  }
  resize() {
    if (!this.cv.isConnected) return;
    const r = this.cv.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) return;
    const dpr = Math.min(2.5, window.devicePixelRatio || 1);
    const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
    if (this.cv.width === w && this.cv.height === h) return;
    this.cv.width = w; this.cv.height = h;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.W = r.width; this.H = r.height;
    this.redraw();
  }
  bind() {
    const cv = this.cv;
    cv.style.touchAction = 'none';
    const pos = e => {
      const r = cv.getBoundingClientRect();
      const p = (e.pressure && e.pressure > 0) ? e.pressure : (e.pointerType === 'pen' ? 0.5 : 0.55);
      return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height, p];
    };
    cv.addEventListener('pointerdown', e => {
      if (!cv.classList.contains('act')) return;
      e.preventDefault();
      try { cv.setPointerCapture(e.pointerId); } catch (err) { }
      const p = pos(e);
      if (this.eraser) { this.eraseAt(p); return; }
      this.drawing = true; this.pid = e.pointerId;
      this.cur = { color: this.color, size: this.size, pts: [p] };
      this.strokes.push(this.cur);
      this.seg(this.cur, 0);
    });
    cv.addEventListener('pointermove', e => {
      if (!this.drawing || !this.cur) return;
      if (this.pid !== e.pointerId) return;
      e.preventDefault();
      const ev = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      ev.forEach(ev2 => {
        const p = pos(ev2);
        const last = this.cur.pts[this.cur.pts.length - 1];
        if (Math.abs(p[0] - last[0]) < 0.0015 && Math.abs(p[1] - last[1]) < 0.0015) return;
        this.cur.pts.push(p); this.seg(this.cur, this.cur.pts.length - 2);
      });
    });
    const end = e => {
      if (!this.drawing) return;
      this.drawing = false; this.cur = null;
      if (this.onChange) this.onChange(this.toJSON());
    };
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', end);
    cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && this.drawing) end(); });
  }
  seg(st, i) {
    if (i < 0 || !st.pts[i + 1]) return;
    const [x1, y1, p1] = st.pts[i], [x2, y2, p2] = st.pts[i + 1];
    const ctx = this.ctx;
    ctx.strokeStyle = st.color;
    ctx.lineWidth = (st.size || 2.4) * (0.5 + (p1 + p2) / 2 * 1.25);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x1 * this.W, y1 * this.H);
    ctx.lineTo(x2 * this.W, y2 * this.H);
    ctx.stroke();
  }
  redraw() {
    if (!this.W) return;
    this.ctx.clearRect(0, 0, this.W, this.H);
    this.strokes.forEach(st => st.pts.forEach((p, i) => this.seg(st, i - 1)));
  }
  eraseAt(p) {
    const rad = 0.022;
    this.strokes = this.strokes.filter(st => !st.pts.some(q => Math.hypot(q[0] - p[0], q[1] - p[1]) < rad));
    this.redraw();
    if (this.onChange) this.onChange(this.toJSON());
  }
  undo() { this.strokes.pop(); this.redraw(); if (this.onChange) this.onChange(this.toJSON()); }
  clear() { this.strokes = []; this.redraw(); if (this.onChange) this.onChange(this.toJSON()); }
  load(arr) { this.strokes = Array.isArray(arr) ? JSON.parse(JSON.stringify(arr)) : []; this.redraw(); }
  toJSON() { return this.strokes.map(s => ({ color: s.color, size: s.size, pts: s.pts.map(p => [Math.round(p[0] * 10000) / 10000, Math.round(p[1] * 10000) / 10000, Math.round(p[2] * 100) / 100]) })); }
  isEmpty() { return !this.strokes.length; }
  exportPNG(name) {
    const tmp = document.createElement('canvas');
    const dpr = 2; tmp.width = this.W * dpr; tmp.height = this.H * dpr;
    const c = tmp.getContext('2d');
    c.fillStyle = '#fff'; c.fillRect(0, 0, tmp.width, tmp.height);
    c.scale(dpr, dpr);
    const oldCtx = this.ctx, oldW = this.W, oldH = this.H;
    // 复用绘制逻辑：临时替换上下文
    const real = this.ctx; this.ctx = c;
    this.strokes.forEach(st => st.pts.forEach((p, i) => this.seg(st, i - 1)));
    this.ctx = real;
    tmp.toBlob(b => {
      const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = (name || '批注') + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    }, 'image/png');
  }
}

const HOME = { ym: todayStr().slice(0, 7) };

function ensureSettings() {

}

function heroHTML() {
  const e = activeExam();

  const left = diffDays(e.date, todayStr());
  const start = state.settings.startDate || todayStr();
  const span = Math.max(1, diffDays(e.date, start));

  const p = Math.round(passed / span * 100);
  const n = Math.abs(left);
  return `<div class="hero">
    <div class="tools"><button onclick="openExamManager()">编辑考试</button>${state.exams.length > 1 ? '<button onclick="openExamManager()">切换</button>' : ''}</div>

  </div>`;
}

function calHTML(ym) {
  const s = getStats();
  const first = parseYmd(ym + '-01');
  const days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7;
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<div class="d blank"></div>';
  for (let d = 1; d <= days; d++) {
    const ds = ym + '-' + pad2(d);
    const c = s.dayMap[ds] || 0;
    const lv = c ? (c >= s.goal ? 4 : c >= s.goal * 0.6 ? 3 : c >= s.goal * 0.25 ? 2 : 1) : 0;
    const cls = ['d', 'l' + lv, ds === todayStr() ? 'today' : ''].filter(Boolean).join(' ');
    cells += `<div class="${cls}" title="${ds} · ${c} 题" onclick="showDay('${ds}')"><span>${d}</span>${c ? `<span class="n">${c}</span>` : ''}</div>`;
  }
  return `<div class="cal-head"><button class="btn sm ghost" onclick="calShift(-1)">‹</button><div class="m">${first.getFullYear()} 年 ${first.getMonth() + 1} 月</div><button class="btn sm ghost" onclick="calShift(1)">›</button><div class="sp"></div><button class="btn sm ghost" onclick="calToday()">回到本月</button></div>
  <div class="cal-wk">${['一', '二', '三', '四', '五', '六', '日'].map(w => '<span>' + w + '</span>').join('')}</div>
  <div class="cal">${cells}</div>
  <div class="cal-legend"><span>少</span><i></i><i style="background:color-mix(in srgb,var(--accent) 14%,var(--panel2))"></i><i style="background:color-mix(in srgb,var(--accent) 30%,var(--panel2))"></i><i style="background:color-mix(in srgb,var(--accent) 52%,var(--panel2))"></i><i style="background:var(--accent)"></i><span>多（达到每日目标为最深）</span></div>`;
}
function calShift(n) {
  const d = parseYmd(HOME.ym + '-01'); d.setMonth(d.getMonth() + n);
  HOME.ym = ymd(new Date(d.getFullYear(), d.getMonth(), 1));
  render();
}
function calToday() { HOME.ym = todayStr().slice(0, 7); render(); }

function showDay(ds) {
  const recs = state.records.filter(r => r.date === ds);
  const byM = {};
  recs.forEach(r => { byM[r.module] = byM[r.module] || { t: 0, c: 0 }; byM[r.module].t += num(r.count); byM[r.module].c += num(r.correct); });
  const todos = state.todos.filter(t => t.date === ds);
  const total = recs.reduce((a, b) => a + num(b.count), 0), ok = recs.reduce((a, b) => a + num(b.correct), 0);
  const rows = Object.keys(byM).map(m => `<tr><td>${esc(m)}</td><td class="num">${byM[m].t}</td><td class="num">${pct(byM[m].c, byM[m].t)}%</td></tr>`).join('');
  openModal(fmtCN(ds) + ' ' + fmtW(ds), `
    <div class="pstat" style="margin-bottom:14px">
      <div><div class="k">刷题</div><div class="v">${total}<small> 题</small></div></div>
      <div><div class="k">正确率</div><div class="v">${pct(ok, total)}<small>%</small></div></div>
      <div><div class="k">待办完成</div><div class="v">${todos.filter(t => t.done).length}<small> / ${todos.length}</small></div></div>
    </div>
    ${rows ? `<div class="scroll-x"><table class="tbl"><thead><tr><th>模块</th><th>题量</th><th>正确率</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="muted small">这天还没有刷题记录。</div>'}
    ${todos.length ? '<hr class="sep"><div class="small muted" style="margin-bottom:6px">当日待办</div>' + todos.map(t => `<div style="font-size:13px;padding:3px 0">${t.done ? '✓' : '○'} ${esc(t.text)}</div>`).join('') : ''}
  `, { okText: '补记刷题', onOk: () => { openQuickRecord(ds); return false; } });
}

function moduleBars() {
  const s = getStats();
  return MODULES.map(m => {
    const v = s.byMod[m] || { t: 0, c: 0 };
    const a = pct(v.c, v.t);
    return `<div class="bar-row"><div class="nm">${m}</div><div class="bar-track"><div class="bar-fill" style="width:${v.t ? Math.max(2, a) : 0}%"></div></div><div class="vl">${v.t ? '<b>' + a + '</b>%' : '<span class="muted">—</span>'}<br><span class="small muted" style="font-size:10px">${v.t}题</span></div></div>`;
  }).join('');
}

/* ============================================================
   5. 行测刷题
   ============================================================ */
const PRACTICE = {
  tab: 'drill', module: '', chapter: '', source: '', undone: false, onlyFav: false,
  sess: null, inkOn: false, ink: null, color: '#263238', penSize: 2.4, eraser: false,
  limit: 20
};

function answeredSet() { const s = new Set(); state.records.forEach(r => { if (r.qid) s.add(r.qid); }); return s; }

function filteredQuestions() {
  let qs = state.questions.slice().sort((a, b) => a.createdAt - b.createdAt);
  if (PRACTICE.onlyFav) qs = qs.filter(q => q.favorited);
  if (PRACTICE.module) qs = qs.filter(q => q.module === PRACTICE.module);
  if (PRACTICE.source) qs = qs.filter(q => (q.source || '') === PRACTICE.source);
  if (PRACTICE.undone) { const done = answeredSet(); qs = qs.filter(q => !done.has(q.id)); }
  if (PRACTICE.chapter.trim()) { const kw = PRACTICE.chapter.trim(); qs = qs.filter(q => ((q.chapter || '') + ' ' + (q.stem || '')).includes(kw)); }
  return qs;
}
function buildSession(ids) { PRACTICE.sess = { ids, i: 0, chosen: {}, revealed: {}, self: {} }; }
function startSession() {
  const qs = filteredQuestions();
  if (!qs.length) { toast('当前筛选下没有题目，先导入或新增题目'); return; }
  const ids = qs.slice(0, PRACTICE.limit === 999 ? qs.length : PRACTICE.limit).map(q => q.id);
  buildSession(ids); PRACTICE.inkOn = false; render();
}
function curQ() { const s = PRACTICE.sess; if (!s) return null; return state.questions.find(q => q.id === s.ids[s.i]) || null; }
function gotoQ(n) {
  const s = PRACTICE.sess; if (!s) return;
  s.i = clamp(n, 0, s.ids.length - 1); saveInk(); render();
}
function chooseOpt(k) {
  const q = curQ(), s = PRACTICE.sess; if (!q || !s) return;
  if (s.revealed[q.id]) return;
  if (!q.options || !q.options[k]) return;
  s.chosen[q.id] = k;
  paintOpts();
}
function paintOpts() {
  const q = curQ(), s = PRACTICE.sess; if (!q) return;
  const chosen = s.chosen[q.id], rev = s.revealed[q.id];
  $$('#view .opt').forEach(btn => {
    const k = btn.dataset.k;
    btn.classList.toggle('sel', !rev && chosen === k);
    if (rev) {
      btn.classList.toggle('right', k === q.answer);
      btn.classList.toggle('wrong', k !== q.answer && k === chosen);
    }
  });
  const sb = $('#submitBtn');
  if (sb && !rev) sb.disabled = !chosen;
}
function submitAnswer() {
  const q = curQ(), s = PRACTICE.sess; if (!q || !s) return;
  if (s.revealed[q.id]) return;
  const chosen = s.chosen[q.id];
  if (!chosen) { toast('先选一个答案'); return; }
  const ok = chosen === q.answer;
  s.revealed[q.id] = true;
  addRecord({ module: q.module, chapter: q.chapter || '', count: 1, correct: ok ? 1 : 0, qid: q.id, source: q.source || '题库', kind: 'single' });
  if (!ok) upsertWrong(q, chosen);
  save(); render();
  toast(ok ? '答对了' : '答错了，已收入错题库');
}
function submitSelf(ok) {
  const q = curQ(), s = PRACTICE.sess; if (!q || !s) return;
  if (s.revealed[q.id]) return;
  s.self[q.id] = !!ok; s.revealed[q.id] = true;
  addRecord({ module: q.module, chapter: q.chapter || '', count: 1, correct: ok ? 1 : 0, qid: q.id, source: q.source || '图片题', kind: 'single' });
  if (!ok) upsertWrong(q, '');
  save(); render();
  toast(ok ? '已记为做对' : '已记为做错，已收入错题库');
}

function saveInk() {
  const q = curQ();
  if (q && PRACTICE.ink && !PRACTICE.ink.isEmpty()) { q.ink = PRACTICE.ink.toJSON(); save(); }
}
function toggleInk() {
  saveInk();
  PRACTICE.inkOn = !PRACTICE.inkOn;
  if (!PRACTICE.inkOn) PRACTICE.ink = null;
  render();
}
function mountInk() {
  const cv = $('#inkCv'); if (!cv) return;
  const q = curQ(); if (!q) return;
  if (!PRACTICE.inkOn) { cv.classList.remove('act'); return; }
  cv.classList.add('act');
  const ink = new Ink(cv, strokes => { if (q) { q.ink = strokes; save(); } });
  ink.color = PRACTICE.color; ink.size = PRACTICE.penSize; ink.eraser = PRACTICE.eraser;
  ink.load(q.ink || []);
  PRACTICE.ink = ink;
}
function setInkColor(c) {
  PRACTICE.color = c; PRACTICE.eraser = false;
  if (PRACTICE.ink) { PRACTICE.ink.color = c; PRACTICE.ink.eraser = false; }
  $$('.sw').forEach(s => s.classList.toggle('on', s.dataset.c === c));
  $('#eraserBtn')?.classList.remove('primary');
}
function setInkEraser() {
  PRACTICE.eraser = !PRACTICE.eraser;
  if (PRACTICE.ink) PRACTICE.ink.eraser = PRACTICE.eraser;
  const b = $('#eraserBtn'); if (b) { b.classList.toggle('primary', PRACTICE.eraser); }
  toast(PRACTICE.eraser ? '橡皮擦：在笔迹上划动即可擦除' : '已切回笔');
}
function undoInk() { if (PRACTICE.ink) PRACTICE.ink.undo(); }
function clearInk() {
  if (!PRACTICE.ink) return;
  confirmModal('清空本题的所有手写批注？', () => { PRACTICE.ink.clear(); const q = curQ(); if (q) { q.ink = []; save(); } });
}
function saveInkPng() {
  if (!PRACTICE.ink || PRACTICE.ink.isEmpty()) { toast('还没有手写内容'); return; }
  const q = curQ();
  PRACTICE.ink.exportPNG((q ? q.module + '_' + clip(q.stem, 12) : '批注'));
}

/* 错题入库 */
function upsertWrong(q, chosen) {
  let w = state.wrongs.find(x => x.qid === q.id);
  if (!w) {
    w = {
      id: uid('w'), qid: q.id, module: q.module, chapter: q.chapter || '', stem: q.stem, image: q.image || '',
      options: q.options, answer: q.answer, mine: chosen, analysis: q.analysis || '', type: '', reason: '',
      status: '待复测', count: 1, createdAt: Date.now(), lastAt: Date.now(), reviews: [], source: q.source || '', tags: [], favorite: false
    };
    state.wrongs.unshift(w);
  } else {
    w.count = num(w.count) + 1; w.lastAt = Date.now(); w.mine = chosen;

/* 题目编辑器 */
let _qeImage = '';
function pickFile(accept, cb) {
  const inp = $('#fileInput'); inp.value = ''; inp.accept = accept; inp.multiple = false;
  inp.onchange = () => { const f = inp.files[0]; if (f) cb(f); };
  inp.click();
}
function compressImage(file, cb, max = 1500) {
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
      const c = cv.getContext('2d');
      c.fillStyle = '#fff'; c.fillRect(0, 0, cv.width, cv.height);
      c.drawImage(img, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL('image/jpeg', 0.82));
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

function openBatchImport() {
  openModal('批量导入题目', `
    <div class="row" style="margin-bottom:12px"><button class="btn" onclick="pickBankFile()">选择 JSON 题库文件</button><span class="small muted">按题追加，不覆盖已有数据</span></div>

      <div><label class="fld">统一章节</label><input type="text" id="biChapter" placeholder="如 判断推理-图形推理"></div>
      <div class="full"><label class="fld">统一来源</label><input type="text" id="biSource" placeholder="如 刷题本 第2章"></div>
    </div>
    <label class="fld">每行一题，用竖线 | 分隔：题干 | 选项A | 选项B | 选项C | 选项D | 答案 | 解析（可空）</label>
    <textarea id="biText" rows="8" placeholder="下列属于行政处罚的是？|警告|拘役|罚金|有期徒刑|A|行政处罚包括警告、罚款、没收违法所得等。"></textarea>
    <div class="small muted" style="margin-top:8px">答案也可以写 1/2/3/4 对应 A/B/C/D；解析可以为空。导入后会立即出现在题库里。</div>
  `, {
    okText: '导入', onOk: () => {
      const text = $('#biText').value.trim();
      if (!text) { toast('请先粘贴内容'); return false; }
      const module = $('#biModule').value, chapter = $('#biChapter').value.trim(), source = $('#biSource').value.trim();
      let okCnt = 0, bad = 0;
      text.split('\n').forEach(line => {
        line = line.trim(); if (!line) return;
        const p = line.split('|').map(s => s.trim());
        if (p.length < 6) { bad++; return; }
        const stem = p[0], opts = [p[1], p[2], p[3], p[4]].filter(Boolean);
        let ans = p[5].toUpperCase(), ana = p.slice(6).join('|').trim();
        if (['1', '2', '3', '4'].includes(ans)) ans = String.fromCharCode(64 + Number(ans));
        if (!/^[A-E]$/.test(ans) || opts.length < 2) { bad++; return; }
        if (ans.charCodeAt(0) - 65 >= opts.length) { bad++; return; }
        const options = {}; opts.forEach((t, i) => options[String.fromCharCode(65 + i)] = t);
        state.questions.push({ id: uid('q'), module, chapter, source, stem, options, answer: ans, analysis: ana, image: '', favorited: false, ink: [], createdAt: Date.now() });
        okCnt++;
      });
      if (!okCnt) { toast('没有识别到有效题目，请检查分隔格式'); return false; }
      save(); render(); toast('成功导入 ' + okCnt + ' 题' + (bad ? '，跳过 ' + bad + ' 行' : ''));
    }
  });
}

/* JSON 题库文件导入（追加，不覆盖） */
function pickBankFile() {
  pickFile('application/json,.json', f => {
    const fr = new FileReader();
    fr.onload = () => {
      let data;
      try { data = JSON.parse(String(fr.result)); } catch (e) { toast('JSON 解析失败，请检查文件格式'); return; }
      const rows = Array.isArray(data) ? data : (data && Array.isArray(data.questions) ? data.questions : null);
      if (!rows) { toast('文件里没有题目数组'); return; }
      openBankPreview(rows, f.name);
    };
    fr.readAsText(f, 'utf-8');
  });
}
function bankRowValid(r) {
  if (!r || typeof r !== 'object') return false;
  if (String(r.stem || '').trim().length < 6) return false;
  const o = r.options && typeof r.options === 'object' ? r.options : null;
  if (!o) return false;
  const keys = ['A', 'B', 'C', 'D'].filter(k => String(o[k] || '').trim());
  if (keys.length < 2) return false;
  return keys.includes(String(r.answer || '').trim().toUpperCase());
}
function openBankPreview(rows, name) {
  const ok = rows.filter(bankRowValid);
  const bad = rows.length - ok.length;
  if (!ok.length) { toast('没有识别到有效题目'); return; }
  const dist = {}; ok.forEach(r => { const c = String(r.chapter || '未分类'); dist[c] = (dist[c] || 0) + 1; });
  const dup = ok.filter(r => state.questions.some(q => q.stem.trim() === String(r.stem).trim())).length;
  closeModal();

    <div class="small muted" style="line-height:1.8">${Object.keys(dist).map(k => esc(k) + ' ' + dist[k] + ' 题').join(' ｜ ')}</div>
    <label class="fld" style="margin-top:12px">前 3 题预览</label>
    ${ok.slice(0, 3).map(r => `<div class="mini-box" style="margin-bottom:8px"><div style="font-weight:600">${esc(r.chapter || '未分类')} · ${esc(r.module || '言语理解')}</div><div style="margin-top:4px;color:var(--sub);max-height:64px;overflow:hidden">${esc(String(r.stem).slice(0, 120))}…</div></div>`).join('')}
    <div class="small muted" style="margin-top:8px">导入为追加模式，不会覆盖已有题目、刷题记录与错题。</div>`, {
    okText: '导入 ' + ok.length + ' 题', onOk: () => {
      let added = 0, skipped = 0;
      ok.forEach(r => {
        const stem = String(r.stem).trim(), chapter = String(r.chapter || '').trim();
        if (state.questions.some(q => q.stem.trim() === stem)) { skipped++; return; }
        const options = {};
        ['A', 'B', 'C', 'D', 'E'].forEach(k => { if (String(r.options[k] || '').trim()) options[k] = String(r.options[k]).trim(); });
        state.questions.push({ id: uid('q'), module: String(r.module || '言语理解'), chapter, source: String(r.source || 'JSON 导入'), stem, options, answer: String(r.answer).toUpperCase(), analysis: String(r.analysis || ''), image: '', favorited: false, ink: [], createdAt: Date.now() });
        added++;
      });
      save(); render(); toast(`已导入 ${added} 题${skipped ? '，跳过重复 ' + skipped + ' 题' : ''}`);
    }
  });
}

/* ---------- 变式题生成（同型换数） ---------- */
function rnd(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function shuffleOpts(correct, wrongs) {
  correct = Number(correct);
  const set = [correct];
  (wrongs || []).forEach(w => {
    const v = Number(w);
    if (isFinite(v) && !set.includes(v)) set.push(v);
  });
  let k = 2;
  while (set.length < 4) { const c = correct + k; if (!set.includes(c)) set.push(c); k += 2; }
  const all = set.slice(0, 4);
  for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[all[i], all[j]] = [all[j], all[i]]; }
  const options = {}; all.forEach((v, i) => options[String.fromCharCode(65 + i)] = String(v));
  return { options, answer: String.fromCharCode(65 + all.indexOf(correct)) };
}
function gGrowth() {
  const base = rnd(4, 25) * 100, r = [5, 8, 10, 12, 15, 20, 25][rnd(0, 6)];
  const correct = Math.round(base * (1 + r / 100));
  const o = shuffleOpts(correct, [Math.round(base * (1 - r / 100)), Math.round(base * r / 100), Math.round(base / (1 + r / 100))]);
  return { stem: `某地 2025 年某指标为 ${base} 亿元，2026 年同比增长 ${r}%，则 2026 年该指标约为多少亿元？`, analysis: `现期值 = 基期值 ×（1 + 增长率）= ${base} ×（1 + ${r}%）= ${correct}。注意“增长到”用加法、“增长”用乘法，别把增长率当成增长量。`, ...o, topic: '增长率' };
}
function gRatio() {
  const total = rnd(5, 20) * 100, part = Math.round(total * rnd(10, 60) / 100 / 10) * 10;
  const correct = Math.round(part / total * 1000) / 10;
  const o = shuffleOpts(correct, [Math.round(total / part * 1000) / 10, correct + 10, correct - 8]);
  return { stem: `某市 2026 年一般公共预算支出 ${total} 亿元，其中教育支出 ${part} 亿元，教育支出占比约为：`, analysis: `比重 = 部分 ÷ 总体 × 100% = ${part} ÷ ${total} ≈ ${correct}%。分子分母别颠倒，先看“占”字后面是谁。`, ...o, topic: '比重' };
}
function gAvg() {
  const n = rnd(4, 9), avg = rnd(20, 80), total = n * avg;
  const o = shuffleOpts(avg, [total, avg + rnd(3, 9), Math.max(1, avg - rnd(3, 9))]);
  return { stem: `某单位 ${n} 个部门全年共完成 ${total} 项任务，各部门平均完成多少项？`, analysis: `平均数 = 总量 ÷ 个数 = ${total} ÷ ${n} = ${avg}。`, ...o, topic: '平均数' };
}
function gWork() {
  const pairs = [[6, 3], [12, 4], [10, 15], [20, 30], [8, 24], [9, 18], [12, 6], [15, 10], [20, 5], [30, 20]];
  const [a, b] = pairs[rnd(0, pairs.length - 1)];
  const correct = Math.round(a * b / (a + b) * 10) / 10;
  const o = shuffleOpts(correct, [a + b, Math.round((a + b) / 2), Math.round(a * b / (a + b)) + 1]);
  return { stem: `一项工程，甲单独做需 ${a} 天，乙单独做需 ${b} 天。两人合作需要多少天完成？`, analysis: `合作时间 = 1 ÷ (1/${a} + 1/${b}) = ${a}×${b} ÷ (${a}+${b}) ≈ ${correct} 天。`, ...o, topic: '工程问题' };
}
function gTrip() {
  const v1 = rnd(3, 9) * 10, v2 = rnd(2, 8) * 10, t = rnd(1, 4);
  const s = (v1 + v2) * t;
  const o = shuffleOpts(t, [Math.max(1, Math.round(s / Math.abs(v1 - v2))), t + 1, Math.max(1, t - 1)]);
  return { stem: `甲乙两地相距 ${s} 千米，两车分别以 ${v1} 千米/时、${v2} 千米/时同时相向开出，多久相遇？`, analysis: `相遇时间 = 路程 ÷ 速度和 = ${s} ÷ (${v1}+${v2}) = ${t} 小时。`, ...o, topic: '行程问题' };
}
function gProfit() {
  const cost = rnd(5, 20) * 10, p = [10, 20, 25, 30, 40, 50][rnd(0, 5)];
  const correct = cost * (1 + p / 100);
  const o = shuffleOpts(correct, [cost * (1 - p / 100), cost * p / 100, cost]);
  return { stem: `某商品成本 ${cost} 元，按成本 ${p}% 的利润率定价，售价是多少元？`, analysis: `售价 = 成本 ×（1 + 利润率）= ${cost} ×（1 + ${p}%）= ${correct} 元。`, ...o, topic: '利润问题' };
}
function genVariant(w) {
  const txt = (w.stem || '') + ' ' + (w.chapter || '');
  const module = w.module;
  if (/工程|合作|效率/.test(txt)) return gWork();
  if (/行程|速度|相遇|千米/.test(txt)) return gTrip();
  if (/利润|成本|售价|折扣/.test(txt)) return gProfit();
  if (/增长率|同比|环比|增幅/.test(txt)) return gGrowth();
  if (/比重|占比|比例/.test(txt)) return gRatio();
  if (/平均|人均|均值/.test(txt)) return gAvg();
  const pool = module === '资料分析' ? [gGrowth, gRatio, gAvg] : module === '数量关系' ? [gWork, gTrip, gProfit] : [];
  if (!pool.length) return null;
  return pool[rnd(0, pool.length - 1)]();
}
let _variant = null, _variantDone = false, _variantWid = '', _variantModule = '';
function openVariant(wid) {
  const w = state.wrongs.find(x => x.id === wid); if (!w) return;
  _variantWid = wid; _variantModule = w.module;
  const v = genVariant(w);
  if (!v) {
    openModal('举一反三 · 复盘引导', `
      <div class="small muted" style="margin-bottom:10px">该题型暂不支持自动换数生成，可用下面的「同型重做」四步法：</div>
      <div class="mini-box good" style="line-height:1.9">1. 找出原题的「已知—所求」结构，把它写成一句话。<br>

const POLICY = { cat: '', kw: '', open: {} };
const POL_KEYWORDS = ['高质量发展', '新质生产力', '中国式现代化', '全过程人民民主', '乡村振兴', '共同富裕', '生态文明', '基层治理', '民生保障', '数字经济', '科技创新', '文化自信', '国家安全', '一带一路', '深化改革', '依法治国', '就业', '教育', '养老', '医疗', '住房', '消费', '粮食安全', '能源安全', '人工智能'];

function guessCategory(t) {
  if (/会议|全会|政治局|常务会|座谈会|论坛|峰会/.test(t)) return '会议';
  if (/讲话|指示|批示|致辞|强调|指出/.test(t)) return '讲话';
  if (/印发|出台|发布|意见|通知|条例|办法|规划|方案/.test(t)) return '政策文件';
  if (/同比|环比|增长|亿元|万亿元|百分|指数|统计/.test(t)) return '经济数据';
  if (/科技|人工智能|芯片|航天|创新|研发|数字/.test(t)) return '科技';
  if (/民生|就业|教育|医疗|养老|住房|社保|收入/.test(t)) return '民生';
  if (/生态|环保|碳|绿色|污染|减排/.test(t)) return '生态';
  if (/文化|文艺|非遗|文物|文明|传承/.test(t)) return '文化';
  if (/外交|两国|双边|会见|访问|国际/.test(t)) return '外交';
  if (/党建|干部|党风|纪律|巡视|组织/.test(t)) return '党建';
  return '其他';
}
function suggestTags(t) { return POL_KEYWORDS.filter(k => t.includes(k)).slice(0, 6); }

async function loadPdfJs() {
  if (window.pdfjsLib) return window.pdfjsLib;
  if (!window._pdfPromise) {
    window._pdfPromise = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://fastly.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
      s.onload = () => {
        try { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://fastly.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'; } catch (e) { }
        res(window.pdfjsLib);
      };
      s.onerror = () => { window._pdfPromise = null; rej(new Error('PDF 解析组件加载失败（首次需要联网），可先复制文本粘贴录入')); };
      document.head.appendChild(s);
    });
  }
  return window._pdfPromise;
}
async function extractPdfText(file) {
  const lib = await loadPdfJs();
  if (!lib) throw new Error('PDF 解析组件不可用，可先复制文本粘贴录入');
  const buf = await file.arrayBuffer();
  const pdf = await lib.getDocument({ data: buf }).promise;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    pages.push(tc.items.map(it => it.str + (it.hasEOL ? '\n' : '')).join(' '));
  }
  return { text: pages.join('\n\n'), pages: pdf.numPages };
}
function handlePolicyPdf(file) {
  if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') { toast('请上传 PDF 文件'); return; }
  openModal('解析时政 PDF', `<div class="row"><span class="small muted">正在读取「${esc(file.name)}」…</span></div><div class="bar-track" style="margin-top:12px"><div class="bar-fill" id="pdfBar" style="width:12%"></div></div><div class="small muted" style="margin-top:10px">文字版 PDF 才能提取；扫描版需要先 OCR（可改用粘贴文本）。</div>`, { okText: false, footHtml: '' });
  extractPdfText(file).then(r => {
    closeModal();
    openPolicyEditor('', { text: r.text, title: file.name.replace(/\.pdf$/i, ''), pages: r.pages });
    toast('已解析 ' + r.pages + ' 页，请确认后保存');
  }).catch(e => {
    closeModal();
    openModal('PDF 解析失败', `<div style="line-height:1.8;font-size:13.5px">${esc(e.message)}</div><div class="small muted" style="margin-top:10px">可以改为「粘贴文本」，把 PDF 里的文字复制进来同样能保存。</div>`, { okText: '改为粘贴文本', onOk: () => { openPolicyEditor('', {}); return false; } });
  });
}

    ${preset && preset.pages ? `<div class="small muted" style="margin-top:6px">来源 PDF 共 ${preset.pages} 页，已提取文字，建议先粗读再保存。</div>` : ''}
  `, {

      if ($('#poSplit') && $('#poSplit').checked) {

          save(); render(); toast('已拆分为 ' + blocks.length + ' 条');
          return true;
        }
      }
      state.politics.push({ id: uid('po'), date, cat: c, tags, title: tt, content: body, createdAt: Date.now() });
      save(); render(); toast('已保存');
    }
  });
}

    if (e.key === 'Enter') {
      if (PRACTICE.sess.revealed[q.id]) gotoQ(PRACTICE.sess.i + 1);
      else if (PRACTICE.sess.chosen[q.id]) submitAnswer();
    }
  }
});

/* 启动 */
(async function boot() {
  await Store.init();
  let raw = null;
  try { raw = await Store.read(); } catch (e) { raw = null; }
  state = normalizeState(raw);
  applyTheme();
  ensureSettings();
  const h = (location.hash || '').replace('#', '');
  setView(VIEWS[h] ? h : 'home');
  refreshBadges();
  window.addEventListener('resize', () => { if (PRACTICE.ink) PRACTICE.ink.resize(); });
  window.addEventListener('beforeunload', () => { try { if (Store.mode === 'local') localStorage.setItem(Store.KEY, JSON.stringify(state)); } catch (e) { } });
})();

</script>
</body>
</html>
